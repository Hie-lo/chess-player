[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-player"
version = "0.1.0"
description = "Post-game and offline-training chess analysis with Stockfish (UCI) — move quality, accuracy and eval reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "python-chess>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chess-player = "chess_player.cli:main"

[tool.setuptools.packages.find]
include = ["chess_player*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
